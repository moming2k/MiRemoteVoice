# MCUboot for firmware updates over Bluetooth (MCUmgr / nRF Connect Device
# Manager app).
SB_CONFIG_BOOTLOADER_MCUBOOT=y

# IMPORTANT: without this MCUboot uses the public development key from the
# MCUboot repository, so anyone could sign firmware for your remote. Generate
# your own key once and keep it private:
#   python3 <ncs>/bootloader/mcuboot/scripts/imgtool.py keygen -k priv.pem -t ed25519
# then uncomment:
# SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="\${APPLICATION_CONFIG_DIR}/keys/priv.pem"
