# ---- Application ----
CONFIG_GPIO=y
CONFIG_LOG=y
CONFIG_APP_LOG_LEVEL_INF=y
CONFIG_MAIN_STACK_SIZE=3584
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ---- Bluetooth LE peripheral ----
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=2
CONFIG_BT_SMP=y
CONFIG_BT_DEVICE_NAME="MiRemoteVoice"
# 961 = HID Keyboard
CONFIG_BT_DEVICE_APPEARANCE=961

# Same workaround as NCS peripheral_hids_keyboard: some laptop controllers
# collide with automatic PHY updates / security requests and disconnect.
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_AUTO_PHY_UPDATE=n

# Bonds survive reboots. ZMS is the recommended settings store for the
# nRF54L RRAM; without an explicit backend Zephyr falls back to
# SETTINGS_NONE and the Mac would have to re-pair after every reset.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

# Throughput for 8 kB/s of ADPCM: large MTU and data length.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=10
# Must exceed the ACL TX buffer count (static assert in the host).
CONFIG_BT_BUF_EVT_RX_COUNT=16
CONFIG_BT_ATT_TX_COUNT=10
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# ---- HID over GATT (voice key) ----
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_INPUT_REP_MAX=1
CONFIG_BT_HIDS_OUTPUT_REP_MAX=1
CONFIG_BT_HIDS_FEATURE_REP_MAX=0
CONFIG_BT_HIDS_ATTR_MAX=21
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_CONN_CTX=y
CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_GATT_CHRC_POOL_SIZE=20

CONFIG_BT_BAS=y

CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="MiRemoteVoice"
CONFIG_BT_DIS_PNP=y
# USB-IF vendor ID source. 0x1915/0xEEEF are Nordic's sample IDs, fine for
# development only: replace with your own VID/PID before shipping.
CONFIG_BT_DIS_PNP_VID_SRC=2
CONFIG_BT_DIS_PNP_VID=0x1915
CONFIG_BT_DIS_PNP_PID=0xEEEF
CONFIG_BT_DIS_PNP_VER=0x0100
